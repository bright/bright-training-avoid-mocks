# Server configuration
server.port=8080

# Logging configuration
logging.level.root=INFO
logging.level.com.example.training=DEBUG

# Spring configuration
spring.application.name=bright-training-avoid-mocks

# GCP Datastore configuration
spring.cloud.gcp.datastore.project-id=${GCP_PROJECT_ID:bright-training-avoid-mocks}
spring.cloud.gcp.datastore.namespace=${GCP_NAMESPACE:development}
spring.cloud.gcp.datastore.emulator.enabled=${GCP_EMULATOR_ENABLED:true}
spring.cloud.gcp.datastore.emulator.host=${GCP_EMULATOR_HOST:localhost:8081}
